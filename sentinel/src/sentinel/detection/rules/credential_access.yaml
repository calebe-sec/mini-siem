version: 1.0
category: credential_access

rules:
  - id: CRED-001
    name: LSASS Memory Dump Attempt
    enabled: true

    metadata:
      description: Detect attempts to dump LSASS memory to extract credentials.
      severity: critical
      confidence: 90
      author: Calebe
      created: 2026-08-06
      mitre:
        tactic: credential_access
        technique: T1003.001

    when:
      any:
        - field: command_line
          operator: contains
          value: procdump

        - field: command_line
          operator: contains
          value: comsvcs.dll

        - field: target_process
          operator: equals
          value: lsass.exe

    response:
      alert: true
      title: LSASS Dump Attempt Detected
      message: A process attempted to access or dump LSASS memory.
      severity: critical

  - id: CRED-002
    name: Mimikatz-like Command Line Detected
    enabled: true

    metadata:
      description: Detect command-line patterns commonly associated with Mimikatz usage.
      severity: critical
      confidence: 90
      author: Calebe
      created: 2026-08-06
      mitre:
        tactic: credential_access
        technique: T1003

    when:
      any:
        - field: command_line
          operator: contains
          value: sekurlsa

        - field: command_line
          operator: contains
          value: mimikatz

    response:
      alert: true
      title: Mimikatz Activity Detected
      message: Command-line arguments matched known Mimikatz patterns.
      severity: critical

  - id: CRED-003
    name: Kerberoasting Attempt
    enabled: true

    metadata:
      description: Detect suspicious Kerberos service ticket requests indicative of Kerberoasting.
      severity: high
      confidence: 75
      author: Calebe
      created: 2026-08-06
      mitre:
        tactic: credential_access
        technique: T1558.003

    when:
      all:
        - field: event_id
          operator: equals
          value: 4769

        - field: ticket_encryption_type
          operator: equals
          value: "0x17"

    response:
      alert: true
      title: Possible Kerberoasting Detected
      message: A service ticket request with weak encryption was observed, possibly Kerberoasting.
      severity: high

  - id: CRED-004
    name: Multiple Failed Logon Attempts
    enabled: true

    metadata:
      description: Detect multiple failed logon attempts that may indicate brute force or password spraying.
      severity: medium
      confidence: 70
      author: Calebe
      created: 2026-08-06
      mitre:
        tactic: credential_access
        technique: T1110

    when:
      all:
        - field: event_id
          operator: equals
          value: 4625

        - field: failed_attempt_count
          operator: greater_than
          value: 5

    response:
      alert: true
      title: Brute Force Attempt Detected
      message: Multiple failed logon attempts detected from the same source.
      severity: medium