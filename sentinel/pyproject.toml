[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-sentinel"
version = "0.1.0"
description = "A Security Operations Center (SOC) Log Parser and Intrusion Detection System (IDS) with ML and LLM integration."
readme = "README.md"
authors = [{ name = "Author", email = "author@example.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "anthropic>=0.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
